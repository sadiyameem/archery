<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Archery</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Archery</h1>
        <div id="scoreBoard">Score: 0 | Misses: 0</div>
        <div id="timer">Timer: 60</div>
        <div id="instructions">Use the touchpad to drag/aim and release to shoot</div>
        <canvas id="gameArea" width="800" height="400"></canvas>
        <div id="gameOver"></div>
        <div id="finalScore"></div>
        <button onclick="resetGame()">Play Again/Speed Up</button>

        <script src="script.js"></script>
    </body>
</html>
